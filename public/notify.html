<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>CleanCode</title>
<style>
  :root { --bg:#ffffff; --fg:#1c1c1e; --muted:#6b6b73; --line:#e6e6e8; --accent:#0e9f6e; --red:#dc2626; --red-soft:#fdecec; --chip:#f4f4f5; }
  .dark { --bg:#171717; --fg:#ededed; --muted:#a1a1a1; --line:#2e2e2e; --accent:#34d399; --red:#f87171; --red-soft:#2c1414; --chip:#232323; }
  html, body { margin:0; background:transparent; overflow:hidden; font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; user-select:none; }
  .wrap { padding:6px; }
  .card { position:relative; box-sizing:border-box; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 8px 24px rgba(0,0,0,.28); padding:14px 34px 14px 14px; display:flex; gap:12px; cursor:pointer;
    animation: in .38s cubic-bezier(.2,.8,.2,1) both; overflow:hidden; }
  .card.out { animation: out .28s ease forwards; }
  @keyframes in { from { opacity:0; transform: translateY(18px) scale(.97); } to { opacity:1; transform:none; } }
  @keyframes out { to { opacity:0; transform: translateX(30px); } }
  .from-top .card { animation-name: in-top; }
  .from-top .card.out { animation-name: out; }
  @keyframes in-top { from { opacity:0; transform: translateY(-18px) scale(.97); } to { opacity:1; transform:none; } }

  /* seta animada: sobe em loop, como um envio contínuo */
  .badge { position:relative; flex:none; width:46px; height:46px; border-radius:13px; background:var(--red-soft); color:var(--red); overflow:hidden; }
  .badge::after { content:""; position:absolute; inset:0; border-radius:13px; box-shadow: inset 0 0 0 0 var(--red); animation: ring 1.8s ease-out infinite; opacity:.35; }
  @keyframes ring { 0% { box-shadow: inset 0 0 0 0 var(--red); } 70% { box-shadow: inset 0 0 0 7px transparent; } 100% { box-shadow: inset 0 0 0 0 transparent; } }
  .badge svg { position:absolute; left:11px; top:11px; width:24px; height:24px; animation: rise 1.4s cubic-bezier(.4,0,.2,1) infinite; }
  .badge svg.b { animation-delay: .7s; }
  @keyframes rise { 0% { transform: translateY(26px); opacity:0; } 25% { opacity:1; } 55% { transform: translateY(0); opacity:1; } 100% { transform: translateY(-28px); opacity:0; } }

  .body { flex:1; min-width:0; }
  .top { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
  .top img { width:14px; height:14px; }
  .title { margin-top:3px; font-size:13.5px; font-weight:600; line-height:1.3; overflow-wrap:anywhere; }
  .row { margin-top:7px; display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; font-size:12px; color:var(--muted); }
  .chip { background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:1px 9px; color:var(--fg); font-weight:500; }
  .amount { color:var(--red); font-weight:700; font-size:15px; display:inline-flex; align-items:center; gap:3px; }
  .amount svg { width:15px; height:15px; animation: hop 1.2s ease-in-out infinite; }
  @keyframes hop { 0%,100% { transform: translateY(1px); } 50% { transform: translateY(-3px); } }
  .detail { margin-top:6px; font-size:12px; line-height:1.35; color:var(--muted); overflow-wrap:anywhere; }
  .detail:empty, .chip:empty { display:none; }
  /* variante "atualização disponível": verde, com o mesmo movimento de subida */
  .update { --red: var(--accent); --red-soft: color-mix(in srgb, var(--accent) 15%, transparent); }
  .close { position:absolute; top:8px; right:8px; width:22px; height:22px; border:0; border-radius:6px; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .close:hover { background:var(--chip); color:var(--fg); }
  .bar { position:absolute; left:0; bottom:0; height:3px; background:var(--accent); opacity:.7; animation: life linear forwards; }
  @keyframes life { from { width:100%; } to { width:0; } }
  .card:hover .bar { animation-play-state: paused; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
<div class="card" id="card">
  <div class="badge">
    <svg class="a" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    <svg class="b" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
  </div>
  <div class="body">
    <div class="top"><img src="./icon.png" alt="" />CleanCode · agora</div>
    <div class="title" id="title"></div>
    <div class="row">
      <span class="chip" id="drive"></span>
      <span class="amount" id="amountWrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg><span id="amount"></span></span>
    </div>
    <div class="detail" id="detail"></div>
  </div>
  <button class="close" id="close" title="Fechar">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="bar" id="bar"></div>
</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.classList.add('dark');
  // cor de destaque escolhida no app (só nos destaques; o fundo continua neutro)
  const acc = q.get('accent');
  if (acc && /^#[0-9a-f]{6}$/i.test(acc)) document.documentElement.style.setProperty('--accent', acc);
  if (q.get('variant') === 'update') document.documentElement.classList.add('update');
  const set = (id, v) => { document.getElementById(id).textContent = v || ''; };
  set('title', q.get('title'));
  // Windows: "Disco C: · Disco local"; macOS: "Disco Macintosh HD" (o ponto de montagem "/" não diz nada)
  const drv = q.get('drive') || '', lbl = q.get('label') || '';
  set('drive', !drv ? '' : drv.startsWith('/') ? 'Disco ' + (lbl || drv) : 'Disco ' + drv + (lbl ? ' · ' + lbl : ''));
  // no canto superior (macOS) o cartão desce da barra de menus
  if (q.get('corner') === 'top') document.body.classList.add('from-top');
  if (q.get('amount')) set('amount', '+' + q.get('amount') + (q.get('amountNote') ? ' ' + q.get('amountNote') : '')); else document.getElementById('amountWrap').style.display = 'none';
  set('detail', q.get('detail'));
  // informa a altura real para a janela crescer até caber todo o texto
  requestAnimationFrame(() => { location.hash = 'h' + Math.ceil(document.getElementById('wrap').getBoundingClientRect().height); });
  const life = +(q.get('ms') || 9000);
  document.getElementById('bar').style.animationDuration = life + 'ms';
  let timer = setTimeout(leave, life), left = false;
  const card = document.getElementById('card');
  card.addEventListener('mouseenter', () => clearTimeout(timer));
  card.addEventListener('mouseleave', () => { timer = setTimeout(leave, 2500); });
  function leave(action) {
    if (left) return; left = true;
    card.classList.add('out');
    setTimeout(() => { location.hash = action === 'open' ? 'open' : 'close'; }, 260);
  }
  card.addEventListener('click', () => leave('open'));
  document.getElementById('close').addEventListener('click', (e) => { e.stopPropagation(); leave('close'); });
</script>
</body>
</html>
