# Compila o helper de sensores do Windows (cc-lhm) a cada mudança nele, sem publicar nada.
# O runner do GitHub roda como administrador e sem o driver PawnIO, que é o caso da issue #1.
# Por isso, o teste também confere que as leituras saem mesmo nesse caso, com um tempo limite.
name: Helper de sensores (verificação)
on:
  push:
    branches: [main, 'test/sensores*']
    paths: ['native/windows/**', '.github/workflows/helper-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar cc-lhm
        run: dotnet build native/windows/cc-lhm/cc-lhm.csproj -c Release -o out
      - name: Arquivos gerados
        shell: bash
        run: ls -la out
      - name: Testar uma leitura (com tempo limite)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\out\cc-lhm.exe -ArgumentList '--once' -RedirectStandardOutput out.json -PassThru -NoNewWindow
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'cc-lhm passou de 90 segundos sem terminar' }
          $raw = Get-Content out.json -Raw
          if (-not $raw) { throw 'cc-lhm não escreveu nenhuma leitura' }
          $j = $raw | ConvertFrom-Json
          "admin: $($j.admin)   pawnio: $($j.pawnio)"
          "etapas: $($j.groups | ConvertTo-Json -Compress)"
          foreach ($h in $j.hardware) {
            $ok = @($h.sensors | Where-Object { $_.value -ne $null }).Count
            "- $($h.type): $($h.name)  sensores com valor: $ok  travado: $($h.stuck)"
            $h.sensors | Where-Object { $_.value -ne $null } | Select-Object -First 4 | ForEach-Object { "    $($_.type) $($_.name) = $($_.value)" }
          }
          if (-not $j.hardware) { throw 'nenhuma peça na leitura' }
          '--- registro (lhm.log) da leitura única'
          Get-Content (Join-Path $env:LOCALAPPDATA 'CleanCode\lhm\lhm.log')
      - name: Testar o modo tarefa (grava a leitura num arquivo a cada segundo)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cc\sensors.json'
          $p = Start-Process -FilePath .\out\cc-lhm.exe -ArgumentList '--loop','--out',$out -PassThru -NoNewWindow
          Start-Sleep -Seconds 12
          $a = (Get-Item $out).LastWriteTimeUtc; Start-Sleep -Seconds 3; $b = (Get-Item $out).LastWriteTimeUtc
          if ($p.HasExited) { throw "o helper fechou sozinho com o código $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          if ($b -le $a) { throw 'o arquivo de leitura parou de ser atualizado' }
          $j = Get-Content $out -Raw | ConvertFrom-Json
          "peças: $(@($j.hardware).Count)   etapas: $($j.groups | ConvertTo-Json -Compress)"
          '--- registro (lhm.log) do modo tarefa'
          Get-Content (Join-Path (Split-Path $out) 'lhm.log')
          '--- marcadores que sobraram'
          Get-ChildItem (Join-Path $env:LOCALAPPDATA 'CleanCode\lhm') -Filter 'opening-*' -ErrorAction SilentlyContinue | % Name
